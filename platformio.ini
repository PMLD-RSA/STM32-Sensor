; PlatformIO Project Configuration File
;
; Target: STM32F030C8T6 (LQFP48, 64KB flash, 8KB RAM) - board generik
; Upload: ST-Link V2 via SWD

[platformio]
; Drive C: hampir penuh, simpan toolchain/framework STM32 di D:
core_dir = D:/.platformio

[env:f030c8]
platform = ststm32
framework = arduino

; Belum ada board F030C8 bawaan PlatformIO, jadi pakai definisi Nucleo F030R8
; (die sama: STM32F030x8, 64KB/8KB) lalu ganti variant ke kemasan 48-pin.
board = nucleo_f030r8
board_build.variant = STM32F0xx/F030C8T
; Header variant & macro board harus ikut diganti ke generic, kalau tidak
; framework tetap mencari variant_NUCLEO_F030R8.h dan variant_generic.cpp /
; generic_clock.c tidak ikut ter-compile (dijaga #if ARDUINO_GENERIC_F030C8TX).
board_build.arduino.variant_h = variant_generic.h
build_flags =
  -DARDUINO_GENERIC_F030C8TX
  ; Default variant generic: Serial = USART2 (PA2/PA3). Pindah ke USART1 PA9/PA10.
  -DSERIAL_UART_INSTANCE=1
  -DPIN_SERIAL_TX=PA9
  -DPIN_SERIAL_RX=PA10
  ; LED bawaan board di PC13 (variant generic tidak mendefinisikannya)
  -DLED_BUILTIN=PC13

; Upload lewat ST-Link V2 (header 4 pin di sisi kanan board):
;   ST-Link GND -> GND, SWCLK -> CLK, SWDIO -> DIO (3.3V ST-Link TIDAK disambung)
;   Daya board dari micro USB (juga menyuplai 5V untuk HC-SR04).
;   Jumper BOOT0 di posisi normal (program jalan), tidak perlu diubah-ubah.
; Config OpenOCD bawaan Nucleo (board/st_nucleo_f0.cfg) pakai
; "reset_config srst_only" yang butuh pin RST ST-Link tersambung, jadi upload
; gagal "Unable to reset target". Pakai perintah OpenOCD sendiri dengan
; target/stm32f0x.cfg + reset software, cukup 4 kabel SWD.
upload_protocol = custom
upload_command = "${platformio.packages_dir}/tool-openocd/bin/openocd" -s "${platformio.packages_dir}/tool-openocd/openocd/scripts" -f interface/stlink.cfg -c "transport select swd" -f target/stm32f0x.cfg -c "reset_config none separate" -c "program {$SOURCE} 0x08000000 verify reset exit"
debug_tool = stlink

; Serial Monitor (USART1 di PA9/PA10) - butuh USB-TTL terpisah, ST-Link V2
; tidak punya jalur serial
monitor_speed = 115200
; monitor_port = COM3
